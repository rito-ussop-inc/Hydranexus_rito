name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'hydranexus-frontend/package-lock.json'

      - name: Install Dependencies & Build
        run: |
          cd hydranexus-frontend
          npm ci
          npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID || 'team_KZSmsOIxAiV1TOkf1TMICFSh' }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID || 'prj_m7drq4GDookk9Nd388XCb4XZMN2S' }}
          working-directory: ./hydranexus-frontend
          vercel-args: '--prod'
          alias-domains: |
            hydra-nexus.vercel.app
